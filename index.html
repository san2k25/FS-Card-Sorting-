<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CAT=[["Demographics","#cdbcff","#7a5cf0"],["Lifestyle & Living","#a9ccff","#2f7ff0"],["Food Habits","#ffe94d","#d9b200"],["Purchasing","#ffb48a","#f06a1d"],["Label Awareness","#9be8b5","#2fa65a"],["Challenges","#ffb8e1","#e0409a"]];
const RAW=`D1|15–18 years
D2|19–24 years
D3|25–34 years
D4|35–44 years
D5|45–59 years
D6|60 years and above
L1|Lives with parents or family
L2|Lives in a hostel or shared accommodation
L3|Lives independently
L4|Manages their own daily meals
L5|Relies on family members for meals
L6|Has a busy routine with limited time for meal preparation
C1|Consumes packaged food daily
C2|Consumes packaged food several times a week
C3|Consumes packaged food occasionally
C4|Frequently consumes packaged snacks
C5|Frequently consumes ready-to-eat or instant meals
C6|Prefers freshly prepared food over packaged alternatives
P1|Purchases packaged food independently
P2|Shares grocery-purchasing responsibilities with family
P3|Relies on someone else to purchase packaged food
P4|Makes purchasing decisions based primarily on price
P5|Prefers familiar brands and products
P6|Compares different products before purchasing
A1|Checks expiry or best-before dates
A2|Reads the ingredients list
A3|Checks nutritional information
A4|Understands sugar, sodium and fat values
A5|Recognises food safety symbols and FSSAI information
A6|Pays attention to front-of-pack health claims
H1|Finds nutritional terminology difficult to understand
H2|Struggles to read small text on packaging
H3|Finds ingredient lists confusing
H4|Has difficulty distinguishing marketing claims from nutritional facts
H5|Finds it difficult to identify unhealthy ingredients
H6|Does not know which label information is most important when purchasing`;
const CD={};RAW.split('\n').forEach(l=>{const[i,t]=l.split('|');CD[i]={t,c:'DLCPAH'.indexOf(i[0])}});
const IDS=Object.keys(CD);
const F=[["age","Age group *",["15–18","19–24","25–34","35–44","45–59","60+"]],["occ","Current occupation *",["School student","College/university student","Working professional","Self-employed","Homemaker","Other"]],["live","Living situation *",["With parents/family","Hostel","Shared accommodation","Living independently","Other"]],["buy","Who usually purchases packaged food for you?",["I purchase it myself","My family purchases it","We share purchasing","Someone else usually purchases it"]],["freq","How often do you consume packaged food?",["Daily","Several times a week","Occasionally","Rarely"]],["dec","Do you decide which packaged food to buy?",["Yes, mostly","Sometimes","Rarely","No"]]];
const OVER=["Expiry / best-before date","Ingredients list","Nutrition table","Food safety symbols / FSSAI","Allergen information","Front-of-pack claims","Small print"];
const TIPS=["Drag a card into a group.","Drop a card on the left to take it out.","Need more? Tap “New group”.","Undo is at the top if you change your mind.","A card can sit in more than one group.","Leave out any card that doesn't fit."];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const uid=()=>Math.random().toString(36).slice(2,8);
const fresh=()=>({step:'home',d:{name:''},order:shuf(IDS),groups:[{id:uid(),name:'',desc:'',why:'',cards:[]}],refl:{best:'',why:'',over:[],hard:''},hist:[],tip:0,busy:0});
let S=fresh(),A={ok:0,docs:[],fa:'',fo:'',fl:'',fb:'',ff:'',tab:'over',q:'',sk:'ts',sd:-1,sp:'live',sel:null,err:'',sub:0},ASK=null;
try{const x=JSON.parse(localStorage.getItem('draft')||'null');if(x&&x.step!=='thanks'&&x.order&&x.order.length==36){S=Object.assign(fresh(),x,{busy:0,hist:[],step:'home',resume:x.step,sheet:null,tut:0,leg:0})}}catch(e){}
const save=()=>{try{if(S.step==='thanks')localStorage.removeItem('draft');else if(S.step!=='admin')localStorage.setItem('draft',JSON.stringify(S))}catch(e){}};
const mas=(c,k,s=90)=>{const f=[`<circle class="eye" cx="36" cy="42" r="4.5"/><circle class="eye" cx="64" cy="42" r="4.5"/><path d="M36 56q14 14 28 0" fill="none" stroke="#1f1a17" stroke-width="3.5" stroke-linecap="round"/>`,`<path d="M30 44q6-9 12 0M58 44q6-9 12 0" fill="none" stroke="#1f1a17" stroke-width="3.5" stroke-linecap="round"/><path d="M36 54h28q-2 16-14 16T36 54z" fill="#1f1a17"/><path d="M44 66q6-5 12 0" fill="#ff7b8b"/>`,`<circle class="eye" cx="36" cy="42" r="4.5"/><path d="M58 44q6-9 12 0" fill="none" stroke="#1f1a17" stroke-width="3.5" stroke-linecap="round"/><path d="M34 55q16 12 32-2" fill="none" stroke="#1f1a17" stroke-width="3.5" stroke-linecap="round"/><path d="M52 61v8a5 5 0 0 0 10-2v-4" fill="#ff7b8b" stroke="#1f1a17" stroke-width="2.5"/>`][k];return `<svg class="mas" width="${s}" height="${s}" viewBox="0 0 100 100"><path d="M14 10h72a4 4 0 0 1 4 4v56L68 92H14a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z" fill="${c}" stroke="#1f1a17" stroke-width="3.5" stroke-linejoin="round"/><path d="M68 92V74a4 4 0 0 1 4-4h18" fill="#fff9" stroke="#1f1a17" stroke-width="3.5" stroke-linejoin="round"/><circle cx="26" cy="54" r="5" fill="#ff9aa8" opacity=".6"/><circle cx="74" cy="54" r="5" fill="#ff9aa8" opacity=".6"/>${f}</svg>`};
const STEPS=['details','brief','board','reflect','review'];
function topbar(){const i=STEPS.indexOf(S.step),b=S.step==='board';return `<div class="str"></div><div class="bar">${i>=0?`<div class="prog">${STEPS.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</div><span>Step ${i+1} of 5</span>`:''}<span class="sp"></span>${b?`<button class="sm" data-a="tut">? How it works</button><button class="sm" data-a="undo" ${S.hist.length?'':'disabled'}>↶ Undo</button><button class="sm" data-a="reset">Clear board</button><button class="sm" data-a="leg">Colours</button>`:''}${S.step==='home'?`<button class="sm" data-a="adm">Admin</button>`:''}${S.step==='admin'?`<button class="sm" data-a="home">Exit admin</button>`:''}</div>`}
const sheetH=()=>{if(S.step!=='board'||!S.sheet)return '';const{id,from}=S.sheet;return `<div class="modal sh"><div class="pn"><h4>${esc(CD[id].t)}</h4><p class="mu">${from==='pool'?'Add to a group':'Move to another group'}</p><div class="chips">${S.groups.map((g,i)=>`<button class="chip ${g.id===from?'on':''}" data-a="sp" data-g="${g.id}">${esc(g.name||'Group '+(i+1))}</button>`).join('')}<button class="chip" data-a="sp" data-g="new">＋ New group</button></div><div class="row">${from!=='pool'?`<button data-a="rm" data-id="${id}" data-g="${from}">Remove from group</button>`:''}<button class="pri" data-a="sx">Close</button></div></div></div>`};
const tutor=()=>S.step==='board'&&S.tut?`<div class="modal"><div class="pn"><h3>How this works</h3><div class="demo"><div class="dg"><b>Quick snackers</b></div><div class="dn">Consumes packaged snacks</div><span class="cur">👆</span></div><ol class="bp" style="font-size:16px"><li><b>Drag</b> a sticky note from the left.</li><li><b>Drop</b> it into a group on the board.</li><li><b>Name</b> the group, then keep adding cards that feel similar.</li></ol><p class="mu">Mix any colours. Move cards whenever you like.</p><button class="pri" data-a="tut">Got it, let's sort</button></div></div>`:'';
/* ---------- STORAGE (Google Sheet via Apps Script) ----------
   Paste your Web app URL (ends with /exec) between the quotes below. */
const API_URL='https://script.google.com/macros/s/AKfycbzfRoV3yb2EgRIGwIUJp3Wnnyosh0gq3ZZxpcg8g6sxrFw9fMN2GdyiIL2DJ3EBN-h_9Q/exec';
const CL=(()=>{let key='',poll=null,last=null;
const call=async b=>{if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL))throw new Error('saving is not set up yet (add the Apps Script URL to index.html)');let r;try{r=await fetch(API_URL,{method:'POST',body:JSON.stringify(b)})}catch(e){throw new Error('no internet connection or server not reachable')}let j;try{j=await r.json()}catch(e){throw new Error('unexpected server reply')}if(!j.ok)throw new Error(j.error||'server error');return j};
const toSnap=j=>({docs:(j.docs||[]).map(d=>({id:d.id,data:()=>d.data}))});
const refresh=()=>poll&&poll.tick(true);
const db={collection:()=>({
doc:id=>({set:data=>call({action:'set',id,data}),delete:async()=>{await call({action:'delete',id,key});refresh()}}),
onSnapshot(cb,err){if(poll)poll.stop=1;const p={stop:0,t:0};poll=p;
p.tick=async force=>{clearTimeout(p.t);if(p.stop)return;if(force||(!document.hidden&&S.step==='admin')){try{const j=last||await call({action:'list',key});last=null;if(!p.stop)cb(toSnap(j))}catch(e){if(!p.stop&&err)err(e)}}if(!p.stop)p.t=setTimeout(()=>p.tick(),15000)};
p.tick(true);return()=>{p.stop=1;clearTimeout(p.t)}}})};
const downloads={save:async({filename,data})=>{const csv=/\.csv$/i.test(filename),b=new Blob([(csv?'﻿':'')+data],{type:(csv?'text/csv':'text/plain')+';charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}};
const user={id:async()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
return {use:async n=>({db,user,downloads})[n]||null,
login:async k=>{const j=await call({action:'list',key:k});key=k;last=j}}})();
const isMob=()=>matchMedia('(max-width:860px)').matches;matchMedia('(max-width:860px)').addEventListener('change',()=>render());
